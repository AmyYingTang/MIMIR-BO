# Ops Manual 骨架模板（Generic）
#
# 本模板定义 ops-manual 类型文档的页面结构和通用提取逻辑。
# 不包含任何项目特定内容（如章节号、具体命令、配置项名等）。
# 项目特定的提取指令由 Step 2 (skeleton) 结合 analyze report 动态生成。

doc_type: ops-manual
description: 面向运维人员的部署与运维手册

pages:
  # ═══════════════════════════════════════
  # 第1批：参考数据页（可并行）
  # ═══════════════════════════════════════

  - path: reference/ports-and-services.md
    sources: [deployment_guide, api_design]
    role: 端口与服务清单
    batch: 1
    extract_strategy: |
      提取端口使用表和服务架构
      提取健康检查端点
      包含生产环境暴露策略（哪些端口仅内部通信）

  - path: reference/env-variables.md
    sources: [deployment_guide]
    role: 环境变量完整参考
    batch: 1
    extract_strategy: |
      提取完整的环境变量/配置项清单
      按分类整理，标注必改项和默认值
      包含密钥生成方式说明

  - path: reference/directory-structure.md
    sources: [deployment_guide]
    role: 目录结构与文件说明
    batch: 1
    extract_strategy: |
      提取部署目录结构
      补充各目录的用途、权限要求、磁盘增长预期

  - path: reference/security-checklist.md
    sources: [deployment_guide, security_arch]
    role: 安全加固检查清单
    batch: 1
    extract_strategy: |
      提取安全检查清单和防火墙/网络配置要求
      补充应用层安全策略
      转化为可勾选的 checklist 格式

  # ═══════════════════════════════════════
  # 第2批：操作指南页（按运维流程顺序）
  # ═══════════════════════════════════════
  #
  # 🔧 本节的页面列表由 Step 2 根据 analyze report 动态确定。
  # 以下是 ops-manual 的通用页面模式，agent 应根据项目实际
  # 部署架构增删页面，但保持以下原则：
  #   - 按运维生命周期顺序：部署 → 配置 → 监控 → 维护 → 故障
  #   - 允许完整技术细节（命令、配置、脚本）
  #   - 每个独立运维场景对应一个 guide 页面
  #
  # 通用页面模式（agent 按项目实际架构生成具体页面）：
  #   guides/fresh-install.md     — 全新部署步骤
  #   guides/ssl-setup.md         — SSL/HTTPS 配置（如适用）
  #   guides/gpu-setup.md         — 特殊硬件配置（如适用）
  #   guides/backup-restore.md    — 备份与恢复
  #   guides/update-rollback.md   — 应用更新与回滚
  #   guides/monitoring-ops.md    — 监控、日志与告警
  #
  # 每页的 extract_strategy 通用原则：
  #   - 允许完整技术细节（命令、配置文件、脚本）
  #   - 保留所有代码块
  #   - 按执行顺序组织，每步标注预期结果
  #   - 标注生产环境推荐方案

  # ═══════════════════════════════════════
  # 第3批：综合页（必须串行，依赖前两批）
  # ═══════════════════════════════════════

  - path: troubleshooting.md
    sources: [deployment_guide]
    role: 故障排查手册
    batch: 3
    extract_strategy: |
      提取常见问题表和日志位置速查
      从已填充的各指南页面补充更多排查场景
      按症状组织（启动失败、连接失败、性能问题）

  - path: quickstart.md
    sources: [synthesized]
    role: 运维快速上手
    batch: 3
    extract_strategy: |
      从已填充的部署指南提炼最小化部署步骤
      假设环境已就绪，聚焦核心操作
      包含部署后验证步骤

  - path: index.md
    sources: [synthesized]
    role: 运维手册首页
    batch: 3
    extract_strategy: |
      系统架构概述（服务组成、依赖关系）
      硬件配置推荐（最低/推荐）
      从已填充页面提炼各章节导航
