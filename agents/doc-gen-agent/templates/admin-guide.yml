# Admin Guide 骨架模板（Generic）
#
# 本模板定义 admin-guide 类型文档的页面结构和通用提取逻辑。
# 不包含任何项目特定内容（如章节号、具体角色名、端点列表等）。
# 项目特定的提取指令由 Step 2 (skeleton) 结合 analyze report 动态生成。

doc_type: admin-guide
description: 面向平台管理员的完整管理操作指南

pages:
  # ═══════════════════════════════════════
  # 第1批：参考数据页（可并行）
  # ═══════════════════════════════════════

  - path: reference/role-matrix.md
    sources: [security_arch, api_design, business_rules]
    role: 角色定义与完整权限矩阵
    batch: 1
    extract_strategy: |
      提取所有角色定义、创建方式、层级关系
      提取各管理端点的权限要求
      合并为一张完整的操作-角色权限矩阵
      比 user-guide 的权限页更详细，包含管理员特有操作

  - path: reference/api-reference.md
    sources: [api_design]
    role: 管理相关 API 参考
    batch: 1
    extract_strategy: |
      提取管理员专用端点，按功能模块分组
      允许展示端点路径和参数（audience=admin 允许管理概念）
      禁止暴露实现细节（ORM、token 结构、中间件）

  - path: reference/status-guide.md
    sources: [state_machines, database_design]
    role: 全部实体状态速查
    batch: 1
    extract_strategy: |
      提取系统中所有实体的状态定义和流转规则
      标注每个状态转换的操作者（用户/管理员/系统）
      标注管理员可执行的操作
      转化为管理员视角的状态说明表 + 简化流程图

  - path: reference/error-codes.md
    sources: [api_design]
    role: 错误码参考表
    batch: 1
    extract_strategy: |
      提取完整错误码表
      筛选管理员可能遇到的错误码
      按场景分组，每个错误码附简要说明和建议操作

  # ═══════════════════════════════════════
  # 第2批：操作指南页（建议按管理工作流顺序）
  # ═══════════════════════════════════════
  #
  # 🔧 本节的页面列表由 Step 2 根据 analyze report 动态确定。
  # 以下是 admin-guide 的通用页面模式，agent 应根据项目实际
  # 管理功能增删页面，但保持以下原则：
  #   - 按管理员日常工作流顺序组织
  #   - 首页应为系统初始化（首次配置流程）
  #   - 每个管理功能模块对应一个 guide 页面
  #
  # 通用页面模式（agent 按项目实际功能生成具体页面）：
  #   guides/system-init.md        — 系统初始化与首次配置
  #   guides/user-management.md    — 用户/账户管理
  #   guides/permission-*.md       — 权限分配与管理
  #   guides/content-*.md          — 业务内容管理
  #   guides/task-*.md             — 任务/队列管理
  #   guides/system-config.md      — 系统配置与参数
  #   guides/audit-*.md            — 审计与日志
  #   guides/monitoring.md         — 监控与健康状态
  #   guides/notifications.md      — 通知与消息管理
  #
  # 每页的 extract_strategy 通用原则：
  #   - 从 api_design 提取管理端点，允许管理概念
  #   - 从 business_rules 提取管理相关约束和校验规则
  #   - 从 state_machines 提取管理员可执行的状态操作
  #   - 禁止暴露实现细节（SQL、ORM、JWT 结构）
  #   - 操作指南用管理员视角描述

  # ═══════════════════════════════════════
  # 第3批：综合页（必须串行，依赖前两批）
  # ═══════════════════════════════════════

  - path: quickstart.md
    sources: [synthesized]
    role: 管理员快速上手
    batch: 3
    extract_strategy: |
      从已填充的 system-init 和核心管理页面提炼
      聚焦管理员首次登录后的核心配置操作
      每步最多 3-4 句话
      具体数值从已填充页面提取确保一致

  - path: faq.md
    sources: [synthesized]
    role: 管理员常见问题
    batch: 3
    extract_strategy: |
      从各指南页面的边界条件和限制反向生成 FAQ
      按管理场景分组
      每个分类 3-5 个问题，总计不超过 25 个

  - path: index.md
    sources: [synthesized]
    role: 管理员首页概览
    batch: 3
    extract_strategy: |
      管理职责概览（而非功能列表），按日常工作流组织
      不同管理角色的职责差异
      每个模块用 1-2 句话概述 + 链接到对应指南页
      从已填充页面提炼功能卡片描述
