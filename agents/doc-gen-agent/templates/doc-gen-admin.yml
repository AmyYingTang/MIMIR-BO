# doc-gen-admin.yml — Admin Guide 生成配置
#
# 用法: ./doc-gen-agent/doc-gen.sh ./doc-gen-admin.yml analyze ~/your-project

# === 固定配置（本文件专用）===
doc_type: admin-guide
audience: admin

# === 项目配置（按项目修改）===
language: zh
output_format: single-html
auto_build: false

# === 源文档路径（相对于 project-dir）===
source_docs:
  prd: docs/design/prd.md
  api_design: docs/design/api-design.md
  database_design: docs/design/database-design.md
  state_machines: docs/design/state-machines.md
  business_rules: docs/design/business-rules.md
  security_arch: docs/design/security-architecture.md
  # admin-guide 通常还需要:
  # deployment_guide: docs/deployment-guide.md

# === 输出路径 ===
# work_dir: 默认 {agent目录}/.work/admin-guide/
# work_dir: /path/to/custom/workdir
output_dir: docs/admin-guide

# === 写作约束 ===
writing_rules:
  tone: friendly-professional
  no_technical_terms: false
  max_admonition_length: 3
  screenshot_placeholders: true
  unknown_value_marker: '[待确认]'

# === 站点元信息 ===
site:
  name: ''
  description: ''
  theme: material
  logo: ''
  color_primary: '#3f51b5'
