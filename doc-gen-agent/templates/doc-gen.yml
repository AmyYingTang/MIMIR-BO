# doc-gen.yml — MIMIR-BO Doc-Gen Agent 配置文件模板
# 复制此文件到项目目录，修改为实际值后使用
#
# 用法: ./doc-gen.sh ./doc-gen.yml all ~/your-project

# === 基本信息 ===
doc_type: user-guide
# 可选值: user-guide | admin-guide | api-doc | ops-manual
# 不同类型会选择不同的骨架模板和术语策略

audience: end-user
# 可选值: end-user | admin | developer | ops
# 决定术语边界（end-user 禁止技术术语，developer 允许）

language: zh
# 可选值: zh | en | bilingual

output_format: mkdocs
# 可选值: mkdocs | markdown-only
# mkdocs: 生成 mkdocs.yml + 构建站点
# markdown-only: 只生成 .md 文件

# === 源文档路径（相对于项目根目录）===
source_docs:
  prd: docs/design/prd.md
  api_design: docs/design/api-design.md
  database_design: docs/design/database-design.md
  state_machines: docs/design/state-machines.md
  business_rules: docs/design/business-rules.md
  security_arch: docs/design/security-architecture.md

# === 输出路径（相对于项目根目录）===
output_dir: docs/user-guide

# === 写作约束 ===
writing_rules:
  tone: friendly-professional
  # 可选值: friendly-professional | formal | casual

  no_technical_terms: true
  # true: 禁止 API 路径、数据库字段等
  # false: 允许技术细节（developer/ops 场景）

  max_admonition_length: 3
  # admonition 内容最多几句话

  screenshot_placeholders: true
  # 是否在合适的位置生成截图占位标记

  unknown_value_marker: '[待确认]'
  # 源文档中缺失信息的标记符号
